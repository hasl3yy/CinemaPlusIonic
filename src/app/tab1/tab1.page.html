<div class="peliculas-container">
  <div class="peliculas-header">
    <h2>Gestión de peliculas</h2>
  </div>

  <div>
    <h3>Anuncios publicados</h3>
    <div class="lista-anuncios">
      @for (a of peliculas(); track a.id_pelicula) {
        <div class="tarjeta-anuncio">
          <img *ngIf="a.imagenPromocional" [src]="a.imagenPromocional" [alt]="a.titulo" />
          <div class="tarjeta-info">
            <h4>{{ a.titulo }}</h4>
            <p>{{ a.sinopsis }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</div>
