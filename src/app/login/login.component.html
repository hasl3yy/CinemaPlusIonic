<div class="login-container">
  <div class="login-card">
    <h2>CinemaPlus - Iniciar Sesión</h2>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" [(ngModel)]="correo" name="correo" placeholder="tu_correo@example.com"
          required />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" [(ngModel)]="contrasena" name="contrasena" placeholder="********"
          required />
      </div>

      <button type="submit" class="btn-submit">Ingresar</button>
      <button type="button" class="btn-submit" style="margin-top:10px;background:#2b2b2b" (click)="irARegistro()">
        Crear cuenta
      </button>
    </form>
  </div>

</div>
